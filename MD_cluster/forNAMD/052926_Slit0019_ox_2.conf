structure          ionized.psf
coordinates        min.coor


set temperature    300
set outputname     052926_Slit0019_ox_2


set a    59.132      
set b   54.426
set c    59.291  
firsttimestep      0


#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on
parameters          ./par_all36m_prot.prm
parameters          ./par_all36_na.prm
parameters          ./par_all36_lipid.prm
parameters          ./par_all36_carb.prm
parameters          ./par_all36_cgenff.prm
parameters          ./par_water_ions.str
parameters          ./par_all36_prot_heme_c.str


bincoordinates        052926_Slit0019_ox_1.restart.coor
binvelocities          052926_Slit0019_ox_1.restart.vel
extendedSystem         052926_Slit0019_ox_1.restart.xsc


# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.
switching           on
switchdist          10.5
pairlistdist        13.5

cellBasisVector1     $a   0.0   0.0;   # vector to the next image
cellBasisVector2    0.0    $b   0.0;
cellBasisVector3    0.0   0.0    $c;
cellOrigin          7.482508182525635 0.9007505774497986 -1.0112297534942627


# Integrator Parameters
timestep            2.0  ;# 2fs/step
rigidBonds          all  ;# needed for 2fs steps
nonbondedFreq       1
fullElectFrequency  2  
stepspercycle       10


# Constant Temperature Control
langevin            on    ;# do langevin dynamics
langevinDamping     5     ;# damping coefficient (gamma) of 5/ps
langevinTemp        $temperature
langevinHydrogen    off    ;# don't couple langevin bath to hydrogens

wrapWater           on;                # wrap water to central cell
wrapAll             on;                # wrap other molecules too



# PME (for full-system periodic electrostatics)
PME                yes;
PMEInterpOrder       6;                # interpolation order (spline order 6 in charmm)
PMEGridSpacing     0.8;                # maximum PME grid space / used to calculate grid size


# Constant Pressure Control (variable volume)
useGroupPressure       yes;            # use a hydrogen-group based pseudo-molecular viral to calcualte pressure and
                                       # has less fluctuation, is needed for rigid bonds (rigidBonds/SHAKE)
useFlexibleCell         no;            # yes for anisotropic system like membrane
useConstantRatio        no;            # keeps the ratio of the unit cell in the x-y plane constant A=B

langevinPiston        on;              # Nose-Hoover Langevin piston pressure control
langevinPistonTarget  1.01325;         # target pressure in bar 1atm = 1.01325bar
langevinPistonPeriod  50.0;            # oscillation period in fs. correspond to pgamma T=50fs=0.05ps
                                       # f=1/T=20.0(pgamma)
langevinPistonDecay   25.0;            # oscillation decay time. smaller value correspons to larger random
                                       # forces and increased coupling to the Langevin temp bath.
                                       # Equall or smaller than piston period
langevinPistonTemp   $temperature;     # coupled to heat bath


# Output
outputName          $outputname

restartfreq         10000     ;# 10,000steps = every 20 ps
dcdfreq             10000
outputEnergies      10000
outputPressure      10000


# Minimization
# minimize            5000

run 100000000 ;# 200ns



